name: Bug report
description: Report a reproducible product or development problem
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the smallest reliable steps that reproduce the problem.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add screenshots, logs with secrets removed, or failing test output.

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the browser, operating system, branch, and commit when relevant.

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed API keys and personal data from the report.
          required: true
